---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
    kubermatic.k8c.io/location: seed
  name: userclusterattributes.kubermatic.k8c.io
spec:
  group: kubermatic.k8c.io
  names:
    kind: UserClusterAttribute
    listKind: UserClusterAttributeList
    plural: userclusterattributes
    singular: userclusterattribute
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.username
          name: Username
          type: string
        - jsonPath: .status.state
          name: State
          type: string
        - jsonPath: .status.reason
          name: Reason
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1
      schema:
        openAPIV3Schema:
          description: |-
            UserClusterAttribute holds what the token webhook of one cluster needs to know about one
            KKP user: whether the user may use the cluster, and the username and groups to return.
            It lives in the cluster-<id> namespace on the seed, one object per user that has tokens
            for the cluster. The seed token controller creates it when the first token of the user
            appears, deletes it when the last one is gone, and writes its status.

            Keeping the user data here instead of on every token means a user with many tokens and
            many groups costs one object per cluster.

            The object name is the KKP User name.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: UserClusterAttributeSpec names the user.
              properties:
                userID:
                  description: UserID is the name of the KKP User.
                  maxLength: 253
                  minLength: 1
                  type: string
                  x-kubernetes-validations:
                    - message: userID is immutable
                      rule: self == oldSelf
              required:
                - userID
              type: object
            status:
              description: |-
                UserClusterAttributeStatus is written by the seed token controller.

                The token webhook must not accept tokens of a user whose attribute is missing, has an
                empty state, or has status.observedGeneration different from metadata.generation; it
                answers HTTP 503 for them.
              properties:
                groups:
                  description: |-
                    Groups are the user's identity provider groups, copied unchanged from the KKP User
                    (spec.groups, set at the last KKP login). The webhook adds the "oidc:" prefix and
                    drops groups it must not return. Empty when Disabled.
                  items:
                    type: string
                  type: array
                  x-kubernetes-list-type: set
                lastEvaluationTime:
                  description: LastEvaluationTime is when the controller last changed the status.
                  format: date-time
                  type: string
                lastTransitionTime:
                  description: LastTransitionTime is when state or reason last changed.
                  format: date-time
                  type: string
                observedGeneration:
                  description: ObservedGeneration is the metadata.generation the controller last evaluated.
                  format: int64
                  type: integer
                reason:
                  description: Reason says why the user is Disabled. Empty when Active.
                  enum:
                    - UserNotFound
                    - ServiceAccountUser
                    - NotProjectMember
                    - UserDisabled
                  type: string
                state:
                  description: State says whether the user may use the cluster.
                  enum:
                    - Active
                    - Disabled
                  type: string
                username:
                  description: |-
                    Username is the Kubernetes username the webhook returns: the user's email in
                    lowercase, copied from the KKP User.
                  type: string
              type: object
          required:
            - spec
          type: object
          x-kubernetes-validations:
            - message: name must equal spec.userID
              rule: self.metadata.name == self.spec.userID
      served: true
      storage: true
      subresources:
        status: {}
